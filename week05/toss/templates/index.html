<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>테스트 결제</title>
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <style>
    body { font-family: sans-serif; max-width: 540px; margin: 40px auto; padding: 0 16px; }
    #pay { width: 100%; padding: 14px; font-size: 16px; border: 0; border-radius: 8px;
           background: #3182f6; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h2>테스트 상품 (1,000원)</h2>
  <div id="payment-method"></div>
  <div id="agreement"></div>
  <button id="pay">결제하기</button>

  <script>
    const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
    const tossPayments = TossPayments(clientKey);
    const widgets = tossPayments.widgets({ customerKey: TossPayments.ANONYMOUS });

    function randomId() {
      return "order-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
    }

    async function init() {
      await widgets.setAmount({ currency: "KRW", value: 1000 });
      await widgets.renderPaymentMethods({ selector: "#payment-method", variantKey: "DEFAULT" });
      await widgets.renderAgreement({ selector: "#agreement", variantKey: "AGREEMENT" });

      document.getElementById("pay").addEventListener("click", async () => {
        await widgets.requestPayment({
          orderId: randomId(),
          orderName: "테스트 상품",
          successUrl: window.location.origin + "/success",
          failUrl: window.location.origin + "/fail",
        });
      });
    }

    init();
  </script>
</body>
</html>
